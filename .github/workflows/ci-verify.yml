# Shared verification steps for branch CI and tag releases. Keep golangci-lint
# version in sync with scripts/golangci-version (read below).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Read golangci-lint version
        id: golangci
        run: |
          v="$(tr -d '[:space:]' < scripts/golangci-version)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Using golangci-lint $v (from scripts/golangci-version)"

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "Unformatted files — run: gofmt -w on:" >&2
            echo "$out" >&2
            exit 1
          fi

      - name: go mod verify
        run: go mod verify

      - name: go mod tidy (working tree must stay clean)
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: ${{ steps.golangci.outputs.version }}
          args: --timeout=5m

      - name: go build
        run: go build ./...

      - name: go test (short, race)
        run: go test -count=1 -race -short ./...

      - name: stdio smoke (race)
        run: go test -count=1 -race ./cmd/service-manager-read-mcp -run '^TestCLI_stdioSmoke$'
