name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "Unformatted files — run: gofmt -w on:" >&2
            echo "$out" >&2
            exit 1
          fi

      - name: go mod verify
        run: go mod verify

      - name: go mod tidy (working tree must stay clean)
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.11.4
          args: --timeout=5m

      - name: go build
        run: go build ./...

      - name: go test (short, race)
        run: go test -count=1 -race -short ./...

      - name: stdio smoke (race)
        run: go test -count=1 -race ./cmd/service-manager-read-mcp -run '^TestCLI_stdioSmoke$'
